spring.application.name=ulaznica
server.port=8080

# Baza u memoriji; shema iz schema.sql, početne podatke puni PocetniPodaci.java
spring.datasource.url=jdbc:h2:mem:ulaznica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never

# Postavke aplikacije
app.naziv=Ulaznica
app.storage-dir=./data/dokumenti
app.cors.allowed-origins=http://localhost:5173
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/ulaznice
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ulaznice/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=ulaznice-api
